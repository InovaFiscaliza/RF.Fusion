<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}RF.Fusion{% endblock %}</title>

    <!-- ===================== CSS INSTITUCIONAL ===================== -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/_Basic.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/OutSystemsReactWidgets.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/webfusion_fonts.css', v='20260811-rawline') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/AnatelReactiveTheme.AnatelReactiveTheme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/AnatelReactiveTheme.AnatelReactiveTheme.extra.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Desempenho_CW.Desempenho.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/webfusion_base.css', v='20260811-header-brand') }}">

    {% block extra_css %}{% endblock %}
</head>

<body class="desktop" data-webfusion-root="{{ url_for('index') }}">

<div id="page-loading-overlay" class="page-loading-overlay" aria-hidden="true">
    <div class="page-loading-dialog" role="status" aria-live="polite">
        <div class="page-loading-spinner"></div>
        <div class="page-loading-title">Carregando</div>
        <div id="page-loading-message" class="page-loading-message">
            Aguarde enquanto a solicitação é processada.
        </div>
    </div>
</div>

<div class="layout layout-top fixed-header">
    <div class="main">
        <header class="header" role="banner">
            <div class="header-top conteudo-centralizado">
                <div class="header-content display-flex">
                    <div class="header-navigation OSInline">
                        <nav class="app-menu-content display-flex background-info text-neutral-0" aria-label="Navegação principal">
                            <div class="header-logo">
                                <a class="application-name display-flex align-items-center full-height wf-header-link" href="{{ url_for('index') }}">
                                    <img class="app-logo" src="{{ url_for('static', filename='img/Desempenho_CW.iconesembg.png') }}" alt="">
                                    <span>RF.Fusion</span>
                                </a>
                            </div>
                        </nav>
                    </div>
                </div>
            </div>
        </header>

        <div class="content">
            <main class="main-content conteudo-centralizado" role="main">
                {% block breadcrumb %}{% endblock %}
                {% block content %}{% endblock %}
            </main>
        </div>

        <footer class="wf-global-footer conteudo-centralizado">
            Desenvolvido por LITE - Laboratório de Inovação Tecnológica - ANATEL
        </footer>
    </div>

</div>

<script src="{{ url_for('static', filename='js/base_page.js', v='20260811-public-prefix') }}"></script>

{% block extra_js %}{% endblock %}

</body>
</html>

{% extends "base.html" %}

{% block title %}RF.Fusion - AppEventos{% endblock %}

{% block content %}
<section class="card wf-panel background-neutral-0 padding-l border-radius-m">
    <h1 class="wf-screen-title">Abrindo AppEventos</h1>
    <p role="status">Aguarde o envio dos seus dados ao AppEventos.</p>
    <form id="eventos-login-form" method="post" action="{{ action_url }}" target="_self" accept-charset="UTF-8" enctype="application/x-www-form-urlencoded">
        {% for name, value in fields.items() %}
        <input type="hidden" name="{{ name }}" value="{{ value }}">
        {% endfor %}
        <button type="submit" class="btn btn-primary">Continuar para AppEventos</button>
    </form>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/login_eventos.js') }}"></script>
{% endblock %}
